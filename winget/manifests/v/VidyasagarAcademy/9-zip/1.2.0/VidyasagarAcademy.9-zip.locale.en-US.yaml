ShortDescription: Free archive manager for Windows with the self-healing .9z format.
Description: |-
  9-zip is a free open-source archive manager for Windows that works like 7-Zip and adds its own self-healing .9z format.
  It creates, opens, extracts and tests 10 formats: 9Z, 7Z, ZIP, TAR, GZIP, BZIP2, XZ, ZSTD, LZ4 and BROTLI. ZIP and 7Z archives can be protected with an AES-256 password.
  The .9z format stores Reed-Solomon recovery data inside the archive, so damaged blocks are rebuilt automatically during extraction, and every file carries a SHA-256 fingerprint.
