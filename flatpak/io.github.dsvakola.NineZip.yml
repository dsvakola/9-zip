# Flatpak recipe for 9-zip, for Flathub.
# It uses the .deb that GitHub builds from this repository's source for
# each release (see .github/workflows/linux-packages.yml), as described
# in the Tauri guide for Flathub.
id: io.github.dsvakola.NineZip
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: 9-zip

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # An archive manager reads and writes the user's files and USB drives.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

modules:
  - name: 9-zip
    buildsystem: simple
    sources:
      # DEB-SOURCE (the GitHub test build replaces these three lines)
      - type: file
        url: https://github.com/dsvakola/9-zip/releases/download/v1.3.2/9-zip_1.3.2_amd64.deb
        sha256: SHA256-OF-THE-RELEASE-DEB
        dest-filename: 9-zip.deb
      - type: file
        path: io.github.dsvakola.NineZip.desktop
      - type: file
        path: io.github.dsvakola.NineZip.metainfo.xml
    build-commands:
      - ar -x 9-zip.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/9-zip /app/bin/9-zip
      - install -Dm644 usr/share/icons/hicolor/scalable/apps/9-zip.svg /app/share/icons/hicolor/scalable/apps/io.github.dsvakola.NineZip.svg
      - for s in 32 64 128 512; do install -Dm644 usr/share/icons/hicolor/${s}x${s}/apps/9-zip.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.dsvakola.NineZip.png; done
      - install -Dm644 usr/share/mime/packages/9-zip.xml /app/share/mime/packages/io.github.dsvakola.NineZip.xml
      - install -Dm644 usr/share/doc/9-zip/copyright /app/share/licenses/io.github.dsvakola.NineZip/LICENSE
      - install -Dm644 io.github.dsvakola.NineZip.desktop -t /app/share/applications
      - install -Dm644 io.github.dsvakola.NineZip.metainfo.xml -t /app/share/metainfo
