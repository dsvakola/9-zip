# Checks that 9-zip builds and passes its tests on Windows and Linux.
name: Check

on:
  push:
    branches: [main, linux]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Release build (Windows installer)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
